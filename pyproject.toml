[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lightsheet-simulator"
version = "0.1.0"
description = "Synthetic 3D biological dataset generator for lightsheet microscopy"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "scikit-image>=0.18.0",
    "tifffile>=2021.7.0",
    "PyQt5>=5.15.0",
    "pyqtgraph>=0.12.0",
    "PyOpenGL>=3.1.0",
]

[project.scripts]
lightsheet-viewer = "simulateLightSheetData:main"
